name: Apply camera-drag picking optimization
on:
  push:
    paths:
      - '.github/workflows/apply-skip-picking-camera-drag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-skip-picking-while-camera-drag
      - name: Skip terrain mouse picking during camera drag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Client/src/main/java/com/jagex/map/SceneGraph.java')
          s = p.read_text()
          old = 'if (mouseInTriangle('
          new = 'if (!Client.getSingleton().mouseWheelDown && mouseInTriangle('
          count = s.count(old)
          if count == 0:
              raise SystemExit('No mouseInTriangle call sites found')
          s = s.replace(old, new)
          p.write_text(s)
          print(f'Updated {count} mouse-picking call sites')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-skip-picking-camera-drag.yml
      - name: Commit optimization
        run: |
          git config user.name 'Johto-Foundry'
          git config user.email '314530853+Johto-Foundry@users.noreply.github.com'
          git add Client/src/main/java/com/jagex/map/SceneGraph.java .github/workflows/apply-skip-picking-camera-drag.yml
          git commit -m 'Skip terrain picking while dragging camera'
          git push origin HEAD:performance-skip-picking-while-camera-drag
