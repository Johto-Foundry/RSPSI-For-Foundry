name: Apply performance profiling instrumentation

on:
  push:
    branches:
      - performance-profiling
    paths:
      - '.github/workflows/apply-performance-profiling.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-profiling
          fetch-depth: 0
      - name: Add frame timing instrumentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/Client.java')
          text = path.read_text()

          old = '''\tpublic final void draw() {\n\t\tif(errorDisplayed.get())\n\t\t\treturn;\n'''
          new = '''\tpublic final void draw() {\n\t\tlong frameStart = System.nanoTime();\n\t\tif(errorDisplayed.get())\n\t\t\treturn;\n'''
          if old not in text: raise SystemExit('draw start not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif(visible) {\n\t\t\tdrawGameScreen();\n\t\t}\n\t\thandleResize();\n\n\t}\n'''
          new = '''\t\tif(visible) {\n\t\t\tdrawGameScreen();\n\t\t}\n\t\thandleResize();\n\t\tlastFrameMs = (System.nanoTime() - frameStart) / 1_000_000.0;\n\n\t}\n'''
          if old not in text: raise SystemExit('draw end not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif (loadState == LoadState.ACTIVE) {\n\t\t\trenderView();\n\t\t}\n'''
          new = '''\t\tif (loadState == LoadState.ACTIVE) {\n\t\t\tlong renderStart = System.nanoTime();\n\t\t\trenderView();\n\t\t\tlastRenderMs = (System.nanoTime() - renderStart) / 1_000_000.0;\n\t\t}\n'''
          if old not in text: raise SystemExit('renderView block not found')
          text = text.replace(old, new, 1)

          old = '''\tpublic void drawGameImage() {\n\t\tgameImageBuffer.finalize();\n\t\tWritableImage finalImg = gameImageBuffer.finalImage;\n'''
          new = '''\tpublic void drawGameImage() {\n\t\tlong presentStart = System.nanoTime();\n\t\tgameImageBuffer.finalize();\n\t\tlastPresentPrepareMs = (System.nanoTime() - presentStart) / 1_000_000.0;\n\t\tWritableImage finalImg = gameImageBuffer.finalImage;\n'''
          if old not in text: raise SystemExit('drawGameImage start not found')
          text = text.replace(old, new, 1)

          old = '''\tpublic int fps;\n\tpublic DisplayCanvas mapCanvas;\n'''
          new = '''\tpublic int fps;\n\tpublic double lastFrameMs;\n\tpublic double lastRenderMs;\n\tpublic double lastPresentPrepareMs;\n\tpublic DisplayCanvas mapCanvas;\n'''
          if old not in text: raise SystemExit('fps field not found')
          text = text.replace(old, new, 1)

          old = '''\t\t\tk += TextRenderUtils.renderLeft(gameImageBuffer, "Fps: " + fps, c, k, i1);\n\t\t\tRuntime runtime = Runtime.getRuntime();\n'''
          new = '''\t\t\tk += TextRenderUtils.renderLeft(gameImageBuffer, "Fps: " + fps, c, k, i1);\n\t\t\tk += TextRenderUtils.renderLeft(gameImageBuffer, String.format("Frame: %.2f ms", lastFrameMs), c, k, i1);\n\t\t\tk += TextRenderUtils.renderLeft(gameImageBuffer, String.format("Render: %.2f ms", lastRenderMs), c, k, i1);\n\t\t\tk += TextRenderUtils.renderLeft(gameImageBuffer, String.format("Present prep: %.2f ms", lastPresentPrepareMs), c, k, i1);\n\t\t\tRuntime runtime = Runtime.getRuntime();\n'''
          if old not in text: raise SystemExit('debug fps line not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-performance-profiling.yml
          git config user.name 'Johto-Foundry'
          git config user.email '314530853+Johto-Foundry@users.noreply.github.com'
          git add -A
          git commit -m 'Add lightweight frame timing instrumentation'
          git push origin HEAD:performance-profiling
