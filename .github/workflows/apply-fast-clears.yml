name: Apply faster framebuffer clears

on:
  push:
    branches:
      - performance-fast-buffer-clears
    paths:
      - '.github/workflows/apply-fast-clears.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-fast-buffer-clears
          fetch-depth: 0
      - name: Replace manual full-buffer clear loops
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Client/src/main/java/com/jagex/draw/raster/GameRaster.java')
          text = path.read_text()
          text = text.replace('package com.jagex.draw.raster;\n\n', 'package com.jagex.draw.raster;\n\nimport java.util.Arrays;\n\n', 1)
          old = '''\tpublic void reset() {\n\t\tint count = width * height;\n\t\tfor (int index = 0; index < count; index++) {\n\t\t\traster[index] = 0;\n\t\t}\n\t}\n'''
          new = '''\tpublic void reset() {\n\t\tArrays.fill(raster, 0, width * height, 0);\n\t}\n'''
          if old not in text: raise SystemExit('GameRaster.reset block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('Client/src/main/java/com/jagex/draw/ImageGraphicsBuffer.java')
          text = path.read_text()
          if 'import java.util.Arrays;' not in text:
              text = text.replace('import java.nio.IntBuffer;\n', 'import java.nio.IntBuffer;\nimport java.util.Arrays;\n', 1)
          old = '''\tpublic void clearPixels(int rgb) {\n\t\tfor (int i = 0; i < pixels.length; i++) {\n\t\t\tpixels[i] = 0xFF000000 | rgb;\n\t\t}\n\t}\n'''
          new = '''\tpublic void clearPixels(int rgb) {\n\t\tArrays.fill(pixels, 0xFF000000 | rgb);\n\t}\n'''
          if old not in text: raise SystemExit('ImageGraphicsBuffer.clearPixels block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-fast-clears.yml
          git config user.name 'Johto-Foundry'
          git config user.email '314530853+Johto-Foundry@users.noreply.github.com'
          git add -A
          git commit -m 'Use optimized array fills for framebuffer clears'
          git push origin HEAD:performance-fast-buffer-clears
