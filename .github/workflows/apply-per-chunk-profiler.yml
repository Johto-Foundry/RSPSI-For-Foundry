name: Apply per-chunk render profiler

on:
  push:
    branches:
      - performance-per-chunk-profiler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-per-chunk-profiler
      - name: Add per-chunk timings
        shell: python
        run: |
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/Client.java')
          text = path.read_text()

          old = '''\t\tstageStart = System.nanoTime();\n\t\tfor (Chunk chunk : chunks) {\n\t\t\ttry {\n\t\t\t\tsceneGraph.setChunk(chunk);\n\t\t\t\tsceneGraph.renderScene(xCameraPos, yCameraPos, xCameraCurve, zCameraPos, currentPlane, yCameraCurve);\n\t\t\t} catch (Exception ex) {\n\t\t\t\tex.printStackTrace();\n\t\t\t}\n\t\t}\n\t\tdouble chunksMs = (System.nanoTime() - stageStart) / 1_000_000.0;'''

          new = '''\t\tstageStart = System.nanoTime();\n\t\tdouble[] chunkTimesMs = new double[chunks.size()];\n\t\tint chunkIndex = 0;\n\t\tfor (Chunk chunk : chunks) {\n\t\t\tlong chunkStart = System.nanoTime();\n\t\t\ttry {\n\t\t\t\tsceneGraph.setChunk(chunk);\n\t\t\t\tsceneGraph.renderScene(xCameraPos, yCameraPos, xCameraCurve, zCameraPos, currentPlane, yCameraCurve);\n\t\t\t} catch (Exception ex) {\n\t\t\t\tex.printStackTrace();\n\t\t\t} finally {\n\t\t\t\tchunkTimesMs[chunkIndex++] = (System.nanoTime() - chunkStart) / 1_000_000.0;\n\t\t\t}\n\t\t}\n\t\tdouble chunksMs = (System.nanoTime() - stageStart) / 1_000_000.0;'''

          if old not in text:
              raise SystemExit('Could not find chunk render timing block')
          text = text.replace(old, new, 1)

          old_log = '''\t\tif (now - lastRenderBreakdownLog >= 1000L) {\n\t\t\tlastRenderBreakdownLog = now;\n\t\t\tSystem.out.printf("[RENDER] total=%.2f ms | anim=%.2f | setup=%.2f | chunks=%.2f | cycle=%.2f | cleanup=%.2f | debug=%.2f | finalize=%.2f | loadedChunks=%d%n",\n\t\t\t\ttotalMs, animablesMs, setupMs, chunksMs, cycleEndMs, cleanupMs, debugMs, finalizeMs, chunks.size());\n\t\t}\n'''

          new_log = '''\t\tif (now - lastRenderBreakdownLog >= 1000L) {\n\t\t\tlastRenderBreakdownLog = now;\n\t\t\tSystem.out.printf("[RENDER] total=%.2f ms | anim=%.2f | setup=%.2f | chunks=%.2f | cycle=%.2f | cleanup=%.2f | debug=%.2f | finalize=%.2f | loadedChunks=%d%n",\n\t\t\t\ttotalMs, animablesMs, setupMs, chunksMs, cycleEndMs, cleanupMs, debugMs, finalizeMs, chunks.size());\n\t\t\tStringBuilder chunkLine = new StringBuilder("[CHUNKS]");\n\t\t\tfor (int index = 0; index < chunkTimesMs.length; index++) {\n\t\t\t\tChunk timedChunk = chunks.get(index);\n\t\t\t\tchunkLine.append(String.format(" #%d(%d,%d)=%.2fms", index, timedChunk.regionX, timedChunk.regionY, chunkTimesMs[index]));\n\t\t\t}\n\t\t\tSystem.out.println(chunkLine.toString());\n\t\t}\n'''

          if old_log not in text:
              raise SystemExit('Could not find render log block')
          text = text.replace(old_log, new_log, 1)
          path.write_text(text)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-per-chunk-profiler.yml
      - name: Commit profiler
        run: |
          git config user.name "Johto-Foundry"
          git config user.email "314530853+Johto-Foundry@users.noreply.github.com"
          git add Client/src/main/java/com/jagex/Client.java .github/workflows/apply-per-chunk-profiler.yml
          git commit -m "Add per-chunk render timing output"
          git push origin performance-per-chunk-profiler
