name: OpenGL prototype CI

on:
  push:
    branches:
      - renderer-opengl-experimental
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1'
      - name: Build standalone OpenGL pipeline
        run: gradle -PstandaloneOpenGL :OpenGLPrototype:classes --stacktrace
