name: Apply chunk lookup optimization

on:
  push:
    branches:
      - performance-chunk-index
    paths:
      - '.github/workflows/apply-chunk-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-chunk-index
          fetch-depth: 0
      - name: Add chunk coordinate index
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/Client.java')
          text = path.read_text()

          old = '''\tpublic List<Chunk> chunks = new ArrayList<>();\n\n\tpublic Client() {\n'''
          new = '''\tpublic List<Chunk> chunks = new ArrayList<>();\n\tprivate final Map<Long, Chunk> chunkIndex = new HashMap<>();\n\n\tprivate static long chunkKey(int tileX, int tileY) {\n\t\treturn ((long) (tileX >> 6) << 32) ^ ((tileY >> 6) & 0xffffffffL);\n\t}\n\n\tprivate void rebuildChunkIndex() {\n\t\tchunkIndex.clear();\n\t\tfor (Chunk chunk : chunks) {\n\t\t\tchunkIndex.put(chunkKey(chunk.offsetX, chunk.offsetY), chunk);\n\t\t}\n\t}\n\n\tpublic Client() {\n'''
          if old not in text: raise SystemExit('chunks field block not found')
          text = text.replace(old, new, 1)

          old = '''\tpublic Chunk getCurrentChunk() {\n\t\tfor (int i = chunks.size() - 1; i >= 0; i--) {\n\t\t\tif (chunks.get(i).inChunk(xCameraPos / 128, yCameraPos / 128))\n\t\t\t\treturn chunks.get(i);\n\t\t}\n\t\treturn chunks.isEmpty() ? null : chunks.get(0);\n\t}\n'''
          new = '''\tpublic Chunk getCurrentChunk() {\n\t\tint tileX = xCameraPos / 128;\n\t\tint tileY = yCameraPos / 128;\n\t\tChunk indexed = chunkIndex.get(chunkKey(tileX, tileY));\n\t\tif (indexed != null && indexed.inChunk(tileX, tileY))\n\t\t\treturn indexed;\n\t\tfor (int i = chunks.size() - 1; i >= 0; i--) {\n\t\t\tif (chunks.get(i).inChunk(tileX, tileY))\n\t\t\t\treturn chunks.get(i);\n\t\t}\n\t\treturn chunks.isEmpty() ? null : chunks.get(0);\n\t}\n'''
          if old not in text: raise SystemExit('getCurrentChunk not found')
          text = text.replace(old, new, 1)

          old = '''\t\tif(!pendingChunks.isEmpty()) {\n\t\t\tchunks.addAll(pendingChunks);\n\t\t\tpendingChunks.clear();\n\t\t}\n'''
          new = '''\t\tif(!pendingChunks.isEmpty()) {\n\t\t\tchunks.addAll(pendingChunks);\n\t\t\tpendingChunks.clear();\n\t\t\trebuildChunkIndex();\n\t\t}\n'''
          if old not in text: raise SystemExit('pending chunk merge not found')
          text = text.replace(old, new, 1)

          text = text.replace('\t\tchunks.clear();\n', '\t\tchunks.clear();\n\t\tchunkIndex.clear();\n')
          text = text.replace('\t\tthis.chunks.clear();\n', '\t\tthis.chunks.clear();\n\t\tthis.chunkIndex.clear();\n')

          old = '''\tpublic final int tileHeight(int x, int y, int z) {\n\t\tint worldX = x >> 7;\n\t\tint worldY = y >> 7;\n\t\tfor (Chunk chunk : chunks) {\n\t\t\tif (worldX >= chunk.offsetX && worldX <= chunk.offsetX + 64 && worldY >= chunk.offsetY\n\t\t\t\t\t&& worldY <= chunk.offsetY + 64) {\n\t\t\t\tworldX %= 64;\n\t\t\t\tworldY %= 64;\n\t\t\t\tint plane = z;\n\t\t\t\t/*if (plane < 3 && (chunk.tileFlags[1][worldX][worldY] & MapRegion.BRIDGE_TILE) != 0) {\n\t\t\t\t\tplane++;\n\t\t\t\t}*/\n\n\t\t\t\tint sizeX = x & 0x7f;\n\t\t\t\tint sizeY = y & 0x7f;\n\t\t\t\tint i2 = chunk.mapRegion.tileHeights[plane][worldX][worldY] * (128 - sizeX)\n\t\t\t\t\t\t+ chunk.mapRegion.tileHeights[plane][worldX + 1][worldY] * sizeX >> 7;\n\t\t\t\tint j2 = chunk.mapRegion.tileHeights[plane][worldX][worldY + 1] * (128 - sizeX)\n\t\t\t\t\t\t+ chunk.mapRegion.tileHeights[plane][worldX + 1][worldY + 1] * sizeX >> 7;\n\n\t\t\t\treturn i2 * (128 - sizeY) + j2 * sizeY >> 7;\n\t\t\t}\n\t\t}\n\n\t\treturn 0;\n\t}\n'''
          new = '''\tpublic final int tileHeight(int x, int y, int z) {\n\t\tint worldX = x >> 7;\n\t\tint worldY = y >> 7;\n\t\tChunk chunk = chunkIndex.get(chunkKey(worldX, worldY));\n\t\tif (chunk == null || !chunk.inChunk(worldX, worldY)) {\n\t\t\tfor (Chunk candidate : chunks) {\n\t\t\t\tif (candidate.inChunk(worldX, worldY)) {\n\t\t\t\t\tchunk = candidate;\n\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\tif (chunk == null)\n\t\t\treturn 0;\n\n\t\tworldX -= chunk.offsetX;\n\t\tworldY -= chunk.offsetY;\n\t\tint plane = z;\n\t\tint sizeX = x & 0x7f;\n\t\tint sizeY = y & 0x7f;\n\t\tint i2 = chunk.mapRegion.tileHeights[plane][worldX][worldY] * (128 - sizeX)\n\t\t\t\t+ chunk.mapRegion.tileHeights[plane][worldX + 1][worldY] * sizeX >> 7;\n\t\tint j2 = chunk.mapRegion.tileHeights[plane][worldX][worldY + 1] * (128 - sizeX)\n\t\t\t\t+ chunk.mapRegion.tileHeights[plane][worldX + 1][worldY + 1] * sizeX >> 7;\n\t\treturn i2 * (128 - sizeY) + j2 * sizeY >> 7;\n\t}\n'''
          if old not in text: raise SystemExit('tileHeight method not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-chunk-index.yml
          git config user.name 'Johto-Foundry'
          git config user.email '314530853+Johto-Foundry@users.noreply.github.com'
          git add -A
          git commit -m 'Index chunks by map coordinates'
          git push origin HEAD:performance-chunk-index
