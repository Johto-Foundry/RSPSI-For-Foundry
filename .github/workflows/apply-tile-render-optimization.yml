name: Apply tile render optimization

on:
  push:
    branches:
      - performance-tile-render-optimization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-tile-render-optimization
      - name: Move object mouse handling out of per-tile hot path
        shell: python
        run: |
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/map/SceneGraph.java')
          text = path.read_text()

          old = "\tpublic void renderTile(SceneTile newTile, boolean flag) {\n\t\ttileQueue.addLast(newTile);\n\t\tthis.handleMouseInObject();"
          new = "\tpublic void renderTile(SceneTile newTile, boolean flag) {\n\t\ttileQueue.addLast(newTile);"
          if old not in text:
              raise SystemExit('renderTile target not found')
          text = text.replace(old, new, 1)

          anchor = "\t\tif (!chunkHasTiles) {\n\t\t\t//System.out.println(\"Skipped chunk\");\n\t\t\treturn;\n\t\t}\n"
          replacement = anchor + "\n\t\t// Object hover/edit handling only needs to run once per rendered scene, not once per tile queue seed.\n\t\tthis.handleMouseInObject();\n"
          if anchor not in text:
              raise SystemExit('renderScene insertion point not found')
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-tile-render-optimization.yml
      - name: Commit optimization
        run: |
          git config user.name "Johto-Foundry"
          git config user.email "314530853+Johto-Foundry@users.noreply.github.com"
          git add Client/src/main/java/com/jagex/map/SceneGraph.java .github/workflows/apply-tile-render-optimization.yml
          git commit -m "Move object hover handling out of per-tile render path"
          git push origin performance-tile-render-optimization
