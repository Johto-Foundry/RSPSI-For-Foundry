name: Prepare OpenGL prototype
on:
  push:
    branches: [ performance-skip-picking-while-camera-drag ]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create experimental OpenGL module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('settings.gradle')
          text = settings.read_text()
          if "include ':OpenGLPrototype'" not in text:
              text += "\ninclude ':OpenGLPrototype'\n"
              settings.write_text(text)

          p = Path('OpenGLPrototype/src/main/java/com/rspsi/openglprototype')
          p.mkdir(parents=True, exist_ok=True)
          Path('OpenGLPrototype/build.gradle').write_text('''plugins {\n    id \'application\'\n}\n\ndependencies {\n    implementation project(\':Client\')\n    implementation \'com.metsci.ext.org.jogamp.gluegen:gluegen-rt-main:2.4.0-rc-20200202\'\n    implementation \'com.metsci.ext.org.jogamp.jogl:jogl-all-main:2.4.0-rc-20200202\'\n    implementation \'org.joml:joml:1.9.24\'\n}\n\nmainClassName = \'com.rspsi.openglprototype.FoundryGLPrototype\'\n''')
          Path('OpenGLPrototype/src/main/java/com/rspsi/openglprototype/FoundryGLPrototype.java').write_text(r'''package com.rspsi.openglprototype;

import com.jogamp.opengl.GL;
import com.jogamp.opengl.GL3;
import com.jogamp.opengl.GLAutoDrawable;
import com.jogamp.opengl.GLCapabilities;
import com.jogamp.opengl.GLEventListener;
import com.jogamp.opengl.GLProfile;
import com.jogamp.newt.opengl.GLWindow;
import com.jogamp.opengl.util.Animator;

/**
 * First Foundry OpenGL milestone: proves the donor branch's JOGL path can live
 * beside the working RSPSi code without replacing the current renderer.
 */
public final class FoundryGLPrototype implements GLEventListener {
    private long frames;
    private long lastFpsNanos = System.nanoTime();

    public static void main(String[] args) {
        GLProfile.initSingleton();
        GLProfile profile = GLProfile.get(GLProfile.GL3);
        GLWindow window = GLWindow.create(new GLCapabilities(profile));
        window.setTitle("RSPSi for Foundry - OpenGL Prototype");
        window.setSize(1280, 720);
        window.addGLEventListener(new FoundryGLPrototype());
        window.setVisible(true);

        Animator animator = new Animator(window);
        animator.setRunAsFastAsPossible(true);
        animator.start();
    }

    @Override
    public void init(GLAutoDrawable drawable) {
        GL3 gl = drawable.getGL().getGL3();
        gl.setSwapInterval(0);
        System.out.println("[OPENGL] Renderer: " + gl.glGetString(GL.GL_RENDERER));
        System.out.println("[OPENGL] Vendor: " + gl.glGetString(GL.GL_VENDOR));
        System.out.println("[OPENGL] Version: " + gl.glGetString(GL.GL_VERSION));
    }

    @Override
    public void dispose(GLAutoDrawable drawable) {
    }

    @Override
    public void display(GLAutoDrawable drawable) {
        GL3 gl = drawable.getGL().getGL3();
        gl.glClearColor(0.055f, 0.065f, 0.08f, 1f);
        gl.glClear(GL.GL_COLOR_BUFFER_BIT | GL.GL_DEPTH_BUFFER_BIT);

        frames++;
        long now = System.nanoTime();
        if (now - lastFpsNanos >= 1_000_000_000L) {
            System.out.println("[OPENGL] FPS: " + frames);
            frames = 0;
            lastFpsNanos = now;
        }
    }

    @Override
    public void reshape(GLAutoDrawable drawable, int x, int y, int width, int height) {
        drawable.getGL().getGL3().glViewport(0, 0, width, height);
    }
}
''')
          Path('OpenGLPrototype/src/main/java/com/rspsi/openglprototype/CurrentSceneBridge.java').write_text(r'''package com.rspsi.openglprototype;

import com.jagex.Client;
import com.jagex.chunk.Chunk;

/**
 * Adapter boundary between the working RSPSi scene and the future GPU uploader.
 * It deliberately reads existing scene data without changing editor ownership.
 */
public final class CurrentSceneBridge {
    private CurrentSceneBridge() {}

    public static String describe(Client client) {
        if (client == null) {
            return "client=null";
        }
        StringBuilder out = new StringBuilder("chunks=").append(client.chunks.size());
        for (int i = 0; i < client.chunks.size(); i++) {
            Chunk chunk = client.chunks.get(i);
            out.append(" #").append(i)
               .append('(').append(chunk.offsetX).append(',').append(chunk.offsetY).append(')');
        }
        return out.toString();
    }
}
''')
          Path('OpenGLPrototype/README.md').write_text('''# Foundry OpenGL Prototype\n\nExperimental GPU-renderer staging module kept separate from the working editor.\n\nFirst milestone:\n- JOGL GL3 context and uncapped animator\n- direct dependency on the existing `Client` module\n- `CurrentSceneBridge` boundary for consuming the current chunk scene without replacing editing/save logic\n\nRun with `gradlew :OpenGLPrototype:run`.\n''')
          PY
      - name: Build prototype and current editor
        run: ./gradlew :OpenGLPrototype:classes :Editor:classes
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/prepare-opengl-prototype.yml
          git config user.name "Johto-Foundry"
          git config user.email "314530853+Johto-Foundry@users.noreply.github.com"
          git add settings.gradle OpenGLPrototype .github/workflows/prepare-opengl-prototype.yml
          git commit -m "Add isolated OpenGL renderer prototype" || exit 0
          git push