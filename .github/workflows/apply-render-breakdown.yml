name: Apply render stage profiler

on:
  push:
    branches:
      - performance-render-breakdown

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-render-breakdown
      - name: Apply render profiler patch
        run: python .github/apply_render_breakdown.py
      - name: Remove one-shot patch files
        run: rm .github/workflows/apply-render-breakdown.yml .github/apply_render_breakdown.py
      - name: Commit profiler
        run: |
          git config user.name "Johto-Foundry"
          git config user.email "314530853+Johto-Foundry@users.noreply.github.com"
          git add Client/src/main/java/com/jagex/Client.java .github/workflows/apply-render-breakdown.yml .github/apply_render_breakdown.py
          git commit -m "Add render-stage performance breakdown"
          git push origin performance-render-breakdown
