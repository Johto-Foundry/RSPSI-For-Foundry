name: Apply console performance profiler

on:
  push:
    branches:
      - performance-console-profiler

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-console-profiler
      - name: Add once-per-second console profiler
        shell: python
        run: |
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/Client.java')
          text = path.read_text()

          field_marker = '\tprivate final AtomicBoolean framePresentScheduled = new AtomicBoolean(false);'
          if field_marker not in text:
              raise SystemExit('Could not find frame presentation field')
          text = text.replace(field_marker, field_marker + '\n\tprivate long lastPerfConsoleLog = 0L;', 1)

          marker = '''\t\tlastPresentPrepareMs = (System.nanoTime() - presentStart) / 1_000_000.0;\n\t\tWritableImage finalImg = gameImageBuffer.finalImage;'''
          replacement = '''\t\tlastPresentPrepareMs = (System.nanoTime() - presentStart) / 1_000_000.0;\n\t\tlong now = System.currentTimeMillis();\n\t\tif (now - lastPerfConsoleLog >= 1000L) {\n\t\t\tlastPerfConsoleLog = now;\n\t\t\tSystem.out.printf("[PERF] FPS: %d | Frame: %.2f ms | Render: %.2f ms | Present: %.2f ms%n",\n\t\t\t\tfps, lastFrameMs, lastRenderMs, lastPresentPrepareMs);\n\t\t}\n\t\tWritableImage finalImg = gameImageBuffer.finalImage;'''
          if marker not in text:
              raise SystemExit('Could not find presentation timing block')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-console-profiler.yml
      - name: Commit profiler
        run: |
          git config user.name "Johto-Foundry"
          git config user.email "314530853+Johto-Foundry@users.noreply.github.com"
          git add Client/src/main/java/com/jagex/Client.java .github/workflows/apply-console-profiler.yml
          git commit -m "Add once-per-second console performance logging"
          git push origin performance-console-profiler
