name: Apply hot-path console cleanup

on:
  push:
    branches:
      - performance-remove-hotpath-console
    paths:
      - '.github/workflows/apply-remove-console.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-remove-hotpath-console
          fetch-depth: 0
      - name: Remove frequent synchronous console writes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Client/src/main/java/com/jagex/Client.java')
          text = path.read_text()
          targets = [
              '\t\t\t\tSystem.out.println("MINIMAP");\n',
              '\t\tSystem.out.println("RENDER FULL MAP");\n',
              '\t\t\t\tSystem.out.println("UPDATED TILES");\n',
          ]
          missing = [t for t in targets if t not in text]
          if missing:
              raise SystemExit('Expected console statements not found')
          for target in targets:
              text = text.replace(target, '', 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-remove-console.yml
          git config user.name 'Johto-Foundry'
          git config user.email '314530853+Johto-Foundry@users.noreply.github.com'
          git add -A
          git commit -m 'Remove synchronous console writes from rendering hot paths'
          git push origin HEAD:performance-remove-hotpath-console
